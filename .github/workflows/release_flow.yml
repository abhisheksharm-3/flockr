name: Build & Upload Release Artifacts

# Runs when release-please publishes a GitHub release (or manually). Builds the signed
# APK + AAB and attaches them to the release. Versioning/changelog/tagging are handled by
# release-please (see release_please.yml) — this workflow only builds and uploads.
on:
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version name
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -n "$TAG" ]; then
            NAME="${TAG#v}"
          else
            NAME=$(grep '^VERSION_NAME' version.properties | cut -d'=' -f2 | cut -d'#' -f1 | tr -d '[:space:]')
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create local.properties
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          echo "SUPABASE_URL=$SUPABASE_URL" >> local.properties
          echo "SUPABASE_KEY=$SUPABASE_KEY" >> local.properties

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$HOME/keystore"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$HOME/keystore/release.jks"

      - name: Build signed APK + AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease bundleRelease \
            -Pandroid.injected.signing.store.file="$HOME/keystore/release.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD" \
            --build-cache --stacktrace

      - name: Rename artifacts
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          mv app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/flockr-${VERSION_NAME}-release.apk"
          mv app/build/outputs/bundle/release/app-release.aab "app/build/outputs/bundle/release/flockr-${VERSION_NAME}-release.aab"

      - name: Upload artifacts to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            app/build/outputs/apk/release/flockr-${{ steps.version.outputs.name }}-release.apk
            app/build/outputs/bundle/release/flockr-${{ steps.version.outputs.name }}-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: flockr-release-${{ steps.version.outputs.name }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
