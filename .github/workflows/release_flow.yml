name: Production Release Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# Grant permissions to write into the repo (for changelog updates and tagging)
permissions:
  contents: write

jobs:
  check_version:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version_name: ${{ steps.check.outputs.version_name }}
      version_code: ${{ steps.check.outputs.version_code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for tags
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          
      - name: Check for Version Change
        id: check
        run: python .github/scripts/release_utils.py check

  release:
    needs: check_version
    if: needs.check_version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    
    env:
      VERSION_NAME: ${{ needs.check_version.outputs.version_name }}
      VERSION_CODE: ${{ needs.check_version.outputs.version_code }}
      
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle' 

      - name: Update Changelog
        run: python .github/scripts/release_utils.py update
        
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
           cache-read-only: false 

      - name: Create local.properties
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> local.properties
          echo "SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}" >> local.properties
          
      - name: Decode Keystore
        run: |
          mkdir -p $HOME/keystore
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > $HOME/keystore/release.jks
          
      - name: Build Release APK
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$HOME/keystore/release.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }} \
            --stacktrace
            
      - name: Commit and Tag Release
        run: |
          git config --global user.name "Flockr Bot"
          git config --global user.email "bot@flockr.app"
          
          git add CHANGELOG.md
          git commit -m "chore: release v${{ env.VERSION_NAME }} [skip ci]"
          git tag -a v${{ env.VERSION_NAME }} -m "Release v${{ env.VERSION_NAME }}"
          git push origin main --follow-tags

      - name: Extract Release Notes
        run: python .github/scripts/release_utils.py extract-body

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Visual Update v${{ env.VERSION_NAME }}
          body_path: RELEASE_BODY.md
          files: |
            app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
