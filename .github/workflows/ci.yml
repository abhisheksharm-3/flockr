name: Flockr CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 'wrapper'
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Read Version from Properties
        id: version
        run: |
          VERSION_NAME=$(grep VERSION_NAME version.properties | cut -d'=' -f2)
          VERSION_CODE=$(grep VERSION_CODE version.properties | cut -d'=' -f2)
          
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_ENV
          echo "VERSION_CODE=${VERSION_CODE}" >> $GITHUB_ENV
          
          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "version_code=${VERSION_CODE}" >> $GITHUB_OUTPUT
          
          echo "📦 Building Flockr version ${VERSION_NAME} (${VERSION_CODE})"

      - name: Decode Keystore
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p $HOME/keystore
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > $HOME/keystore/release.jks
          echo "KEYSTORE_PATH=$HOME/keystore/release.jks" >> $GITHUB_ENV

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Release APK
        if: github.event_name != 'pull_request'
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=${KEYSTORE_PATH} \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }} \
            --stacktrace

      - name: Organize APKs
        run: |
          mkdir -p artifacts
          # Copy debug APK if it exists
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk artifacts/flockr-${{ env.VERSION_NAME }}-debug.apk
          fi
          
          # Copy release APK if it exists
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk artifacts/flockr-${{ env.VERSION_NAME }}-release.apk
          fi
          
          ls -la artifacts/

      # Upload artifacts
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: flockr-apks
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: flockr-apks
          path: artifacts/

      - name: Set Version and Changelog
        run: |
          echo "VERSION_NAME=${{ needs.build.outputs.version_name }}" >> $GITHUB_ENV
          echo "Using version: ${{ needs.build.outputs.version_name }}"
          
          FULL_COMMIT_MSG="${{ github.event.head_commit.message }}"
          
          COMMIT_MSG=$(echo "$FULL_COMMIT_MSG" | sed 's/\[release\]//g')
          echo "$COMMIT_MSG" | sed -n '/# Changelog/,$p' > CHANGELOG.md
          
          if [ ! -s CHANGELOG.md ]; then
            echo "# Flockr v${{ needs.build.outputs.version_name }}" > CHANGELOG.md
            echo "" >> CHANGELOG.md
            echo "Release date: $(date +'%Y-%m-%d')" >> CHANGELOG.md
            echo "" >> CHANGELOG.md
            echo "$COMMIT_MSG" >> CHANGELOG.md
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Flockr v${{ env.VERSION_NAME }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
          files: artifacts/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.FLOCKR_TOKEN }}