name: CI

# Validate every PR into main (and pushes to non-main branches) before release.
on:
  pull_request:
    branches: [ "main" ]
  push:
    branches-ignore: [ "main" ]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # BuildConfig needs these fields to exist; placeholders are fine for compile/lint/tests.
      - name: Create local.properties
        run: |
          echo "SUPABASE_URL=https://example.supabase.co" >> local.properties
          echo "SUPABASE_KEY=ci_placeholder_key" >> local.properties

      - name: Build, unit test, and lint
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug --build-cache --stacktrace

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
